[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracking-single-pipeline"
version = "0.1.0"
description = "GVHMR to GMR to G1 single-reference tracking and deployment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5,<2.3", "scipy>=1.14,<1.16", "mujoco>=3.2,<4"]

[project.optional-dependencies]
deploy = ["onnxruntime>=1.19,<2"]
test = ["pytest>=8,<10", "onnx>=1.16,<2", "onnxruntime>=1.19,<2"]

[tool.setuptools.packages.find]
include = ["GMR", "GMR.pipeline", "Deploy"]

[tool.pytest.ini_options]
testpaths = ["Deploy/tests"]
cache_dir = "Deploy/.pytest_cache"
